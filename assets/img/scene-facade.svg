<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="建築立面線條示意圖">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2138"/>
      <stop offset=".55" stop-color="#122c47"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <linearGradient id="fFin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6cf9b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e6cf9b" stop-opacity=".75"/>
      <stop offset="1" stop-color="#e6cf9b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#ffe9b8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b269" stop-opacity=".28"/>
      <stop offset="1" stop-color="#e8b269" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="url(#fBg)"/>

  <!-- vertical fins -->
  <g stroke="url(#fFin)" stroke-width="3">
    <path d="M60 0v1200"/><path d="M115 0v1200"/><path d="M170 0v1200"/>
    <path d="M225 0v1200"/><path d="M280 0v1200"/><path d="M335 0v1200"/>
    <path d="M390 0v1200"/><path d="M445 0v1200"/><path d="M500 0v1200"/>
    <path d="M555 0v1200"/><path d="M610 0v1200"/><path d="M665 0v1200"/>
    <path d="M720 0v1200"/><path d="M775 0v1200"/><path d="M830 0v1200"/>
  </g>

  <!-- balcony bands -->
  <g fill="#081524" opacity=".5">
    <rect y="120" width="900" height="34"/><rect y="210" width="900" height="34"/>
    <rect y="300" width="900" height="34"/><rect y="390" width="900" height="34"/>
    <rect y="480" width="900" height="34"/><rect y="570" width="900" height="34"/>
    <rect y="660" width="900" height="34"/><rect y="750" width="900" height="34"/>
    <rect y="840" width="900" height="34"/><rect y="930" width="900" height="34"/>
    <rect y="1020" width="900" height="34"/><rect y="1110" width="900" height="34"/>
  </g>
  <g stroke="#e6cf9b" opacity=".3">
    <path d="M0 120h900"/><path d="M0 210h900"/><path d="M0 300h900"/>
    <path d="M0 390h900"/><path d="M0 480h900"/><path d="M0 570h900"/>
    <path d="M0 660h900"/><path d="M0 750h900"/><path d="M0 840h900"/>
    <path d="M0 930h900"/><path d="M0 1020h900"/><path d="M0 1110h900"/>
  </g>

  <!-- glass light sweeps -->
  <polygon points="0,0 380,0 150,1200 0,1200" fill="url(#fSweep)"/>
  <polygon points="540,0 660,0 420,1200 320,1200" fill="url(#fSweep)" opacity=".6"/>

  <!-- dusk glow at base -->
  <rect y="900" width="900" height="300" fill="url(#fGlow)"/>
</svg>
